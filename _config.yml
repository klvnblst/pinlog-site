# Configuração do site pinlog.life (GitHub Pages + Jekyll).
# Para editar um texto, abra o arquivo .md da página no GitHub e use o lápis.

title: PinLog
tagline: Organizador pessoal de aplicações e rotinas
description: >-
  Registre aplicações, acompanhe o calendário, o rodízio de regiões do corpo,
  sintomas, peso e estoque. Organizador pessoal com seus dados protegidos.
url: https://pinlog.life
baseurl: ""
lang: pt_BR
locale: pt_BR

logo: /assets/img/icon-512.jpg
image: /assets/img/og-pinlog.png

social:
  name: PinLog
  links: []

company:
  name: T DE A ROCHA
  cnpj: 28.442.137/0001-15
  support_email: suporte@pinlog.life
  privacy_email: privacidade@pinlog.life

# Quando o app estiver nas lojas, coloque os links aqui e os botões da página inicial ativam sozinhos.
stores:
  app_store: ""
  google_play: ""

# Programa de afiliados. Quando a função `affiliates` estiver publicada no Supabase, cole o endereço dela
# em `api` (ex.: https://SEU-PROJETO.supabase.co/functions/v1/affiliates). Com `api` vazio, o cadastro
# mostra "em breve" e o botão da página de afiliados continua abrindo um e-mail.
# `terms_version`: mude a data sempre que alterar os Termos do Programa de Afiliados.
affiliates:
  api: ""
  terms_version: "2026-10-22"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/og-pinlog.png

exclude:
  - README.md
  - COMO-EDITAR.md
  - Gemfile
  - Gemfile.lock
